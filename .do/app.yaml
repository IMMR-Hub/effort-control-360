# Especificación de la app en DigitalOcean App Platform (tarea 107).
#
# Arquitectura: un solo dominio (effort360.disaak.com), dos componentes —
# el sitio estático (apps/web) sirve "/", el servicio (apps/api) sirve
# "/api" — ruteo por path, no por subdominio. Con esto la interfaz y la API
# quedan en el MISMO origen: nada de CORS entre ellos, y la cookie de sesión
# (que en producción exige HTTPS por el prefijo `__Host-`, ver
# apps/api/src/seguridad/sesiones.ts) funciona de la forma más simple y más
# segura posible, sin ningún caso especial.
#
# Esto es un punto de partida para revisar juntos, no algo para pegar e
# importar a ciegas — nadie lo probó contra una cuenta real todavía. Los
# valores entre <> hay que completarlos antes de usarlo.
#
# Referencia: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: effort-control-360
region: nyc
# No hay región de DigitalOcean en Sudamérica; nyc es la más cercana a
# Supabase (São Paulo) de las disponibles. Si más adelante aparece una
# opción más cercana, es un cambio de una sola línea.

services:
  - name: api
    github:
      repo: IMMR-Hub/effort-control-360
      branch: main
      deploy_on_push: true
    source_dir: /
    # El cliente de Prisma lo genera el `postinstall` de
    # apps/api/package.json, que corre solo dentro de `npm ci`.
    #
    # No agregar acá un `npx prisma generate` "por las dudas": no funciona y
    # rompe el build entero. El comando corre desde la raíz del repo, y
    # `prisma` es devDependency del workspace apps/api, así que npm enlaza su
    # binario en apps/api/node_modules/.bin — NO en el .bin de la raíz, que es
    # el único donde npx mira desde acá. Da `sh: 1: prisma: not found`
    # (exit 127). El postinstall sí lo encuentra porque npm arma el PATH de
    # los scripts de ciclo de vida con el .bin del propio workspace.
    # `npx tsc` sí funciona: typescript es devDependency de la raíz.
    # Si alguna vez hiciera falta invocar el CLI de prisma desde la raíz, la
    # forma que funciona es `npm exec --workspace @effort/api -- prisma ...`.
    build_command: npm ci && npx tsc --build
    run_command: node apps/api/dist/arrancar.js
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /salud
      # Ruta pública real, ya existe (apps/api/src/servidor.ts) y no vive
      # bajo /api — DigitalOcean la consulta directo contra el puerto del
      # contenedor, no a través del ruteo público de más abajo, así que
      # queda fuera de la ruta /api sin problema.
    routes:
      - path: /api
    envs:
      - key: NODE_ENV
        value: production
      # Sin esto el build falla, y de formas que despistan mucho. El
      # buildpack de Heroku lee NODE_ENV=production y le pasa a npm la
      # configuración de producción, así que `npm ci` NO instala las
      # devDependencies — donde viven typescript, @types/node y el CLI de
      # prisma, es decir todo lo que el build necesita. Los síntomas no se
      # parecen entre sí y ninguno nombra la causa: errores de tipos
      # (`Cannot find name 'process'`), `prisma: not found` (exit 127), y
      # builds colgados 30 minutos sin salida ni uso de CPU (`npx tsc`
      # intentando descargar typescript del registry). `include` gana sobre
      # `omit`/`production` en la resolución de configuración de npm, así
      # que esta línea alcanza y no hace falta tocar NODE_ENV — que sí se
      # necesita en tiempo de ejecución, porque de él depende el prefijo
      # `__Host-` de la cookie de sesión.
      - key: NPM_CONFIG_INCLUDE
        value: dev
        scope: BUILD_TIME
      - key: PORT
        value: "3000"
      - key: NIVEL_LOG
        value: info
      - key: ORIGEN_PERMITIDO
        value: https://effort360.disaak.com
      # Secretos — se cargan en el panel de DigitalOcean, nunca en este
      # archivo ni en git. Todos DISTINTOS a los de desarrollo (tarea 108):
      # generar SECRETO_COOKIES de nuevo, no copiar el de .env local.
      - key: DATABASE_URL
        type: SECRET
      - key: DIRECT_URL
        type: SECRET
      - key: SECRETO_COOKIES
        type: SECRET
      - key: TURNSTILE_SECRET
        type: SECRET
      - key: AZURE_TENANT_ID
        type: SECRET
      - key: AZURE_CLIENT_ID
        type: SECRET
      - key: AZURE_CLIENT_SECRET
        type: SECRET

static_sites:
  - name: web
    github:
      repo: IMMR-Hub/effort-control-360
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci && npx tsc --build && npm run build --workspace @effort/web
    output_dir: apps/web/dist
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        value: https://effort360.disaak.com
        scope: BUILD_TIME
        # Mismo origen que el sitio: técnicamente podría ser una ruta
        # relativa, pero `cliente.ts` espera una URL absoluta — se deja
        # explícita para no tener que tocar código por esto.

# Corre una sola vez por despliegue, antes de que el servicio nuevo reciba
# tráfico — así una migración nueva ya está aplicada cuando el código que la
# necesita empieza a atender pedidos.
jobs:
  - name: migrar-base
    kind: PRE_DEPLOY
    github:
      repo: IMMR-Hub/effort-control-360
      branch: main
    source_dir: /
    build_command: npm ci
    # `npm exec --workspace`, no `npx`: desde la raíz del repo npx no
    # encuentra el binario de prisma (vive en apps/api/node_modules/.bin).
    # Ver la nota larga en el servicio `api`. Al correr por workspace el
    # directorio de trabajo pasa a ser apps/api, así que el schema se
    # resuelve solo y no hace falta `--schema`.
    run_command: npm exec --workspace @effort/api -- prisma migrate deploy
    envs:
      # El CLI de prisma es una devDependency: sin esto, `npm ci` no lo
      # instala y este job no lo encuentra. Ver la nota larga en el
      # servicio `api`.
      #
      # Sin verificar todavía: este job aún no existe en la app real (por
      # ahora solo está el servicio `api`), y acá prisma hace falta en el
      # `run_command`, no solo durante el build. Si el buildpack poda las
      # devDependencies al cerrar la imagen, esta variable no alcanza y hay
      # que resolverlo de otra forma. Comprobarlo al crear el job de verdad,
      # no darlo por hecho.
      - key: NPM_CONFIG_INCLUDE
        value: dev
        scope: BUILD_TIME
      - key: DATABASE_URL
        type: SECRET
      - key: DIRECT_URL
        type: SECRET
